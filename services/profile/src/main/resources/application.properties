spring.application.name=profile
server.port=${PORT:8080}
# Finish in-flight requests on SIGTERM before the pod goes away.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.main.banner-mode=off

# One JSON object per line on stdout, like the other services.
logging.structured.format.console=logstash

# Connection settings come from DATABASE_URL (see DatabaseConfig), not spring.datasource.*.
profile.database-url=${DATABASE_URL:postgres://sprocketry:sprocketry@localhost:5432/profile}
profile.dapr-http-port=${DAPR_HTTP_PORT:3500}

# The issuer is the public Keycloak URL and the JWKS URL the internal one, so keys are not found by discovery.
profile.oidc.jwks-url=${OIDC_JWKS_URL:}
profile.oidc.issuer=${OIDC_ISSUER:}
profile.oidc.audience=${OIDC_AUDIENCE:sprocketry-api}

# Bound the city check made through the Dapr sidecar; a slow shipping service turns into a 502, not a hang.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s
