[package]
name = "reviews"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Product ratings and reviews; writing one needs a Keycloak access token"
publish = false

[dependencies]
axum = "0.8.9"
# Plain HTTP only: it calls the Dapr sidecar and Keycloak's key set inside the cluster.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
# Pure-Rust crypto, so token checks need no C library.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# TLS for Azure Database for PostgreSQL, which requires it.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "derive"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }

[dev-dependencies]
# Tests sign tokens with a PEM key; the service itself only verifies.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
