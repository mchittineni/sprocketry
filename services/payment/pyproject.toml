[project]
name = "payment"
version = "0.1.0"
description = "Checkout: charges the cart and publishes OrderPlaced events"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools]
packages = ["payment"]
