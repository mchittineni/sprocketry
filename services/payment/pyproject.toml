[project]
name = "payment"
version = "0.1.0"
description = "Checkout: charges the cart and publishes OrderPlaced events"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.160",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx2>=2.16"]

[tool.setuptools]
packages = ["payment"]
