[project]
name = "payment"
version = "0.1.0"
description = "Checkout: charges the cart and publishes OrderPlaced events"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.160",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28",
    "openfeature-sdk>=0.10",
    # 0.6 moved to openfeature-flagd-core 2 and is under two weeks old; Dependabot proposes the bump.
    "openfeature-provider-flagd>=0.5.2,<0.6",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx2>=2.16", "ruff>=0.17"]

[tool.setuptools]
packages = ["payment"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
# random drives fault injection, not anything security sensitive.
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
