name: services

on:
  pull_request:
    paths:
      - services/**
      - .github/workflows/services.yml
      - docker-compose.yaml
      - deploy/dapr/local/**
      - scripts/e2e.sh
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - services/**
  #     - .github/workflows/services.yml
  #     - docker-compose.yaml
  #     - deploy/dapr/local/**
  #     - scripts/e2e.sh

# On a PR, a new push supersedes the running check. On main every commit gets its own group: GitHub cancels
# a queued run when another queues behind it, which would skip building and promoting that commit's services.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter Services
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            storefront: services/storefront/**
            catalog: services/catalog/**
            cart: services/cart/**
            shipping: services/shipping/**
            payment: services/payment/**
            fulfillment: services/fulfillment/**

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---------- Test, per language ----------
      - name: Setup Go
        if: contains(fromJSON('["catalog","fulfillment"]'), matrix.service)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/${{ matrix.service }}/go.mod

      - name: Install golangci-lint
        if: contains(fromJSON('["catalog","fulfillment"]'), matrix.service)
        env:
          GOLANGCI_LINT_VERSION: 2.15.0
          GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
        run: |
          curl -fsSLo /tmp/golangci-lint.tgz \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          echo "${GOLANGCI_LINT_SHA256}  /tmp/golangci-lint.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/golangci-lint.tgz -C /usr/local/bin --strip-components=1 \
            "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint"

      - name: Lint Go Code
        if: contains(fromJSON('["catalog","fulfillment"]'), matrix.service)
        run: test -z "$(gofmt -l .)" && golangci-lint run ./...

      # Catalog's tests run against a real, disposable PostgreSQL.
      - name: Start PostgreSQL
        if: matrix.service == 'catalog'
        run: |
          echo "TEST_DATABASE_URL=postgres://test:test@localhost:5432/catalog" >> "$GITHUB_ENV"
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=catalog postgres:18-alpine
          for _ in $(seq 1 30); do docker exec postgres pg_isready -h 127.0.0.1 -U test && exit 0; sleep 1; done
          exit 1

      - name: Run Go Tests
        if: contains(fromJSON('["catalog","fulfillment"]'), matrix.service)
        run: go vet ./... && go test -race ./...

      - name: Setup .NET
        if: matrix.service == 'cart'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build and Lint .NET Project
        if: matrix.service == 'cart'
        run: dotnet build -c Release -warnaserror && dotnet format Cart.csproj --verify-no-changes

      - name: Run .NET Tests
        if: matrix.service == 'cart'
        working-directory: services/cart/tests
        run: dotnet test -c Release

      - name: Setup Node.js
        if: contains(fromJSON('["storefront","shipping"]'), matrix.service)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Build and Lint Node.js Project
        if: contains(fromJSON('["storefront","shipping"]'), matrix.service)
        run: npm ci && npm run lint && npm run build

      - name: Run Node.js Tests
        if: contains(fromJSON('["storefront","shipping"]'), matrix.service)
        run: npm test

      - name: Setup Python
        if: matrix.service == 'payment'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Lint and Test Python Code
        if: matrix.service == 'payment'
        run: pip install ".[dev]" && ruff check . && ruff format --check . && pytest -q

      # ---------- Image ----------
      # Every repo, including forks, publishes to its own GHCR namespace with no setup.
      # Azure Container Registry is added only when the ACR_NAME variable is set.
      # The Dockerfiles cross-compile on the runner's CPU, so arm64 needs no QEMU emulation.
      - name: Setup BuildX
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Azure Container Registry
        if: github.event_name == 'push' && vars.ACR_NAME != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: github.event_name == 'push' && vars.ACR_NAME != ''
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Compute Image Tags
        id: tags
        env:
          SERVICE: ${{ matrix.service }}
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          # GHCR paths must be lowercase.
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}/$SERVICE"
          {
            echo "tags<<EOF"
            echo "$ghcr:$GITHUB_SHA"
            echo "$ghcr:latest"
            if [ -n "$ACR_NAME" ]; then
              echo "$ACR_NAME.azurecr.io/$SERVICE:$GITHUB_SHA"
              echo "$ACR_NAME.azurecr.io/$SERVICE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Image for Scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          curl -fsSLo /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy

      - name: Scan Image
        env:
          IMAGE: scan/${{ matrix.service }}:${{ github.sha }}
        run: |
          trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 0 "$IMAGE"
          trivy image --ignore-unfixed --severity CRITICAL --exit-code 1 --skip-db-update --quiet "$IMAGE"

      - name: Build and Push Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # SBOM and build provenance are attached to the pushed image as attestations.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # The whole stack with real Dapr sidecars, Valkey and Postgres. Unit tests fake the sidecar; this is
  # what proves the services agree with each other and with Dapr's actual behaviour.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PAYMENT_FAILURE_RATE: "0"
      PAYMENT_DELAY_MS: "0"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Local Stack
        run: docker compose up --build -d

      - name: Run End-to-End Checks
        run: ./scripts/e2e.sh

      - name: Dump Logs
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=100

  # Closes the GitOps loop: once every changed image is pushed, pin those services to this commit's
  # SHA in Git. Argo CD deploys from Git, so this commit is what rolls the new images out.
  # Runs only if every build and the end-to-end checks succeeded, so a release never mixes new and failed services.
  promote:
    needs: [changes, build, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SERVICES: ${{ needs.changes.outputs.services }}
      TAGS_FILE: deploy/helm/sprocketry/values-image-tags.yaml

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Runs for different commits can finish in any order, so a service is only moved forward: its pinned
      # tag must be an ancestor of this commit. Each attempt starts from a fresh main, so a push that lands
      # in between is never fought with a half-finished rebase.
      - name: Pin Image Tags and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            promoted=()
            for svc in $(jq -r '.[]' <<<"$SERVICES"); do
              current=$(yq ".services.\"$svc\".tag // \"\"" "$TAGS_FILE")
              if git cat-file -e "${current}^{commit}" 2>/dev/null && ! git merge-base --is-ancestor "$current" "$GITHUB_SHA"; then
                echo "$svc is pinned to $current, which is newer than ${GITHUB_SHA::7}; leaving it."
                continue
              fi
              yq -i ".services.\"$svc\".tag = \"$GITHUB_SHA\"" "$TAGS_FILE"
              promoted+=("$svc")
            done
            git add "$TAGS_FILE"
            if git diff --cached --quiet; then echo "Tags already current."; exit 0; fi
            cat "$TAGS_FILE"
            list=$(printf '%s, ' "${promoted[@]}")
            git commit -q -m "chore(deploy): promote ${list%, } to ${GITHUB_SHA::7}"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
