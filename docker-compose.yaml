# Local stack: every service runs with a Dapr sidecar sharing its network namespace,
# so services reach their sidecar on localhost:3500 exactly as they do on AKS.
# Image names match what CI publishes, so `make up-prebuilt` can pull instead of build.
# Settings are read from .env (see .env.example).
name: sprocketry

# Each sidecar joins its app's network namespace, so it must be recreated with its app or it stays
# attached to the old container. `restart: true` covers `docker compose restart <app>`; to rebuild
# one service, use `make rebuild SVC=<app>`, which recreates the sidecar too.
# Docker's JSON log files don't record which container wrote them, so each line carries its compose
# service name; the OpenTelemetry Collector turns it into service.name.
x-logging: &logging
  driver: json-file
  options:
    labels: com.docker.compose.service

x-daprd: &daprd
  image: daprio/daprd:${DAPR_VERSION:-1.18.9}
  logging: *logging
  volumes:
    - ./deploy/dapr/local:/components:ro
    - ./deploy/dapr/local-config:/config:ro

x-app-env: &app-env
  DAPR_HTTP_PORT: "3500"

# Services that check Keycloak access tokens. Tokens name the issuer by its public address (the browser's
# view), while the services fetch signing keys from Keycloak directly.
x-oidc-env: &oidc-env
  OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/sprocketry
  OIDC_JWKS_URL: http://keycloak:8080/realms/sprocketry/protocol/openid-connect/certs
  OIDC_AUDIENCE: sprocketry-api

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sprocketry
      POSTGRES_PASSWORD: sprocketry
    volumes:
      - ./deploy/local/create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      # TCP check: the init-time server listens on the socket only, so this waits for init to finish.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sprocketry"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1-alpine

  storefront:
    build: ./services/storefront
    logging: *logging
    image: ${REGISTRY:-ghcr.io/mchittineni/sprocketry}/storefront:${TAG:-latest}
    ports: ["${STOREFRONT_PORT:-3000}:3000"]
    environment:
      <<: *app-env
      STOREFRONT_URL: http://localhost:${STOREFRONT_PORT:-3000}
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/sprocketry
      OIDC_CLIENT_ID: storefront
      OIDC_CLIENT_SECRET: local-dev-storefront-secret
  storefront-dapr:
    <<: *daprd
    depends_on:
      valkey: { condition: service_started }
      storefront: { condition: service_started, restart: true }
    command: ["./daprd", "--app-id", "storefront", "--app-port", "3000", "--resources-path", "/components", "--config", "/config/config.yaml"]
    network_mode: "service:storefront"

  catalog:
    build: ./services/catalog
    logging: *logging
    image: ${REGISTRY:-ghcr.io/mchittineni/sprocketry}/catalog:${TAG:-latest}
    environment:
      <<: *app-env
      DATABASE_URL: postgres://sprocketry:sprocketry@postgres:5432/catalog
    depends_on:
      postgres: { condition: service_healthy }
  catalog-dapr:
    <<: *daprd
    depends_on:
      valkey: { condition: service_started }
      catalog: { condition: service_started, restart: true }
    command: ["./daprd", "--app-id", "catalog", "--app-port", "8080", "--resources-path", "/components", "--config", "/config/config.yaml"]
    network_mode: "service:catalog"

  cart:
    build: ./services/cart
    logging: *logging
    image: ${REGISTRY:-ghcr.io/mchittineni/sprocketry}/cart:${TAG:-latest}
    environment: *app-env
  cart-dapr:
    <<: *daprd
    depends_on:
      valkey: { condition: service_started }
      cart: { condition: service_started, restart: true }
    command: ["./daprd", "--app-id", "cart", "--app-port", "8080", "--resources-path", "/components", "--config", "/config/config.yaml"]
    network_mode: "service:cart"

  shipping:
    build: ./services/shipping
    logging: *logging
    image: ${REGISTRY:-ghcr.io/mchittineni/sprocketry}/shipping:${TAG:-latest}
    environment:
      <<: *app-env
      DATABASE_URL: postgres://sprocketry:sprocketry@postgres:5432/shipping
    depends_on:
      postgres: { condition: service_healthy }
  shipping-dapr:
    <<: *daprd
    depends_on:
      valkey: { condition: service_started }
      shipping: { condition: service_started, restart: true }
    command: ["./daprd", "--app-id", "shipping", "--app-port", "8080", "--resources-path", "/components", "--config", "/config/config.yaml"]
    network_mode: "service:shipping"

  payment:
    build: ./services/payment
    logging: *logging
    image: ${REGISTRY:-ghcr.io/mchittineni/sprocketry}/payment:${TAG:-latest}
    environment:
      <<: *app-env
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0}
      PAYMENT_DELAY_MS: ${PAYMENT_DELAY_MS:-0}
  payment-dapr:
    <<: *daprd
    depends_on:
      valkey: { condition: service_started }
      payment: { condition: service_started, restart: true }
    command: ["./daprd", "--app-id", "payment", "--app-port", "8080", "--resources-path", "/components", "--config", "/config/config.yaml"]
    network_mode: "service:payment"

  fulfillment:
    build: ./services/fulfillment
    logging: *logging
    image: ${REGISTRY:-ghcr.io/mchittineni/sprocketry}/fulfillment:${TAG:-latest}
    environment:
      <<: *app-env
      DISPATCH_MAX_DELAY_MS: ${DISPATCH_MAX_DELAY_MS:-500}
  fulfillment-dapr:
    <<: *daprd
    depends_on:
      valkey: { condition: service_started }
      fulfillment: { condition: service_started, restart: true }
    command: ["./daprd", "--app-id", "fulfillment", "--app-port", "8080", "--resources-path", "/components", "--config", "/config/config.yaml"]
    network_mode: "service:fulfillment"

  reviews:
    build: ./services/reviews
    logging: *logging
    image: ${REGISTRY:-ghcr.io/mchittineni/sprocketry}/reviews:${TAG:-latest}
    environment:
      <<: [*app-env, *oidc-env]
      DATABASE_URL: postgres://sprocketry:sprocketry@postgres:5432/reviews
    depends_on:
      postgres: { condition: service_healthy }
  reviews-dapr:
    <<: *daprd
    depends_on:
      valkey: { condition: service_started }
      reviews: { condition: service_started, restart: true }
    command: ["./daprd", "--app-id", "reviews", "--app-port", "8080", "--resources-path", "/components", "--config", "/config/config.yaml"]
    network_mode: "service:reviews"

  profile:
    build: ./services/profile
    logging: *logging
    image: ${REGISTRY:-ghcr.io/mchittineni/sprocketry}/profile:${TAG:-latest}
    environment:
      <<: [*app-env, *oidc-env]
      DATABASE_URL: postgres://sprocketry:sprocketry@postgres:5432/profile
    depends_on:
      postgres: { condition: service_healthy }
  profile-dapr:
    <<: *daprd
    depends_on:
      valkey: { condition: service_started }
      profile: { condition: service_started, restart: true }
    command: ["./daprd", "--app-id", "profile", "--app-port", "8080", "--resources-path", "/components", "--config", "/config/config.yaml"]
    network_mode: "service:profile"

  # ---------- Identity ----------
  # Keycloak issues shoppers' sign-ins. Admin console: http://localhost:8081/admin (admin/admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm"]
    logging: *logging
    ports: ["${KEYCLOAK_PORT:-8081}:8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: sprocketry
      KC_DB_PASSWORD: sprocketry
      KC_HTTP_ENABLED: "true"
      # The browser reaches Keycloak on the host port; containers reach it as keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Read by the realm import (deploy/helm/sprocketry/files/keycloak), shared with the chart.
      STOREFRONT_URL: http://localhost:${STOREFRONT_PORT:-3000}
      STOREFRONT_CLIENT_SECRET: local-dev-storefront-secret
    volumes:
      - ./deploy/helm/sprocketry/files/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }

  # ---------- Observability ----------
  # Collects traces, metrics and logs and forwards them to the LGTM container.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    # Docker's log files are readable by root only; this is the local stack, not a cluster.
    user: "0"
    volumes:
      - ./deploy/observability/collector-compose.yaml:/etc/otelcol/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otelcol-state:/var/lib/otelcol
    depends_on:
      lgtm: { condition: service_started }

  # Grafana with Loki (logs), Tempo (traces) and Prometheus (metrics) in one container. Sign in as admin/admin.
  # Prometheus also evaluates the SLO rules generated from deploy/slo (`make slo`).
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    volumes:
      - ./deploy/observability/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/sprocketry.yaml:ro
      - ./deploy/helm/sprocketry/files/dashboards:/otel-lgtm/sprocketry-dashboards:ro
      - ./deploy/helm/sprocketry/files/prometheus/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./deploy/helm/sprocketry/files/prometheus/rules:/otel-lgtm/sprocketry-rules:ro

volumes:
  otelcol-state:
