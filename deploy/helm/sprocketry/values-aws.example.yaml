# Copy to values-aws.yaml and fill from `terraform output` in infra/aws/envs/dev (or let
# CLOUD=aws scripts/bootstrap-cluster.sh write it).
cloud: aws

image:
  registry: 123456789012.dkr.ecr.eu-west-2.amazonaws.com
  tag: "0.1.0"

aws:
  region: eu-west-2

gateway:
  enabled: true
  hostname: shop.example.com

# Sign-in through Keycloak at /auth on the storefront's hostname. Serve the gateway over HTTPS before
# shoppers use it: the realm refuses sign-in over plain HTTP from the internet (auth.sslRequired).
auth:
  enabled: true
  storefrontUrl: https://shop.example.com
  keycloakUrl: https://shop.example.com/auth
  keycloakPath: /auth

# Traces, metrics and logs into an in-cluster Grafana (make grafana).
observability:
  collector:
    enabled: true
  lgtm:
    enabled: true

# Canary releases (Argo Rollouts), judged on the in-cluster Prometheus, and runtime fault flags (flagd).
rollouts:
  enabled: true
flags:
  enabled: true
