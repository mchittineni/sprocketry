# Values for a local cluster (kind, k3d, Docker Desktop). Used by scripts/kind-up.sh.
cloud: local

# The same image names `docker compose build` produces; kind-up.sh loads them into the cluster.
image:
  registry: ghcr.io/mchittineni/sprocketry
  tag: dev
  pullPolicy: IfNotPresent

services:
  storefront: { replicas: 1 }
  catalog: { replicas: 1 }
  cart: { replicas: 1 }
  shipping: { replicas: 1 }
  payment: { replicas: 1 }
  fulfillment: { replicas: 1 }
  reviews: { replicas: 1 }
  profile: { replicas: 1 }

# Sign-in through an in-cluster Keycloak, published by kind on http://localhost:8081.
auth:
  enabled: true
  storefrontUrl: http://localhost:8080
  keycloakUrl: http://localhost:8081
  keycloak:
    nodePort: 30081

# Traces, metrics and logs into an in-cluster Grafana (make grafana).
observability:
  environment: local
  collector:
    enabled: true
  lgtm:
    enabled: true

# Canary releases (Argo Rollouts), judged on the in-cluster Prometheus, and runtime fault flags (flagd).
rollouts:
  enabled: true
flags:
  enabled: true
