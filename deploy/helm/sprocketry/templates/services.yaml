{{- $apps := splitList "," (include "sprocketry.apps" .) }}
{{- range $name, $svc := .Values.services }}
{{- if has $name $apps }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "sprocketry.labels" $ | nindent 4 }}
  {{- if and $svc.workloadIdentity (eq $.Values.cloud "azure") }}
  annotations:
    azure.workload.identity/client-id: {{ required "azure.appsClientId is required" $.Values.azure.appsClientId | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "sprocketry.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "sprocketry.labels" $ | nindent 8 }}
        {{- if and $svc.workloadIdentity (eq $.Values.cloud "azure") }}
        azure.workload.identity/use: "true"
        {{- end }}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: {{ $name }}
        dapr.io/app-port: {{ $svc.port | quote }}
        dapr.io/config: sprocketry
        dapr.io/log-as-json: "true"
    spec:
      serviceAccountName: {{ $name }}
      # Spread replicas over nodes, so losing or draining one node doesn't take a whole service down.
      # ScheduleAnyway keeps pods schedulable on a single-node cluster such as kind.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
          matchLabelKeys: [pod-template-hash]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if and (eq $.Values.cloud "local") $svc.secretEnv }}
      # In-cluster Postgres starts alongside the app; wait so the app doesn't crash-loop on first boot.
      initContainers:
        - name: wait-for-postgres
          image: {{ $.Values.local.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h postgres -U {{ $.Values.local.postgres.user }}; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $name }}:{{ $svc.tag | default $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            - name: PORT
              value: {{ $svc.port | quote }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $key := $svc.secretEnv }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ $key }}
            {{- end }}
            {{- if and $svc.oidc $.Values.auth.enabled }}
            # Tokens name Keycloak's public address as issuer; signing keys come from inside the cluster.
            - name: OIDC_ISSUER
              value: {{ printf "%s/realms/sprocketry" (required "auth.keycloakUrl is required" $.Values.auth.keycloakUrl) | quote }}
            - name: OIDC_JWKS_URL
              value: {{ printf "%s/protocol/openid-connect/certs" (include "sprocketry.realmInternalUrl" $) | quote }}
            - name: OIDC_AUDIENCE
              value: {{ $.Values.auth.audience | quote }}
            {{- end }}
            {{- if and $svc.oidcClient $.Values.auth.enabled }}
            - name: STOREFRONT_URL
              value: {{ required "auth.storefrontUrl is required" $.Values.auth.storefrontUrl | quote }}
            - name: OIDC_DISCOVERY_URL
              value: {{ include "sprocketry.realmInternalUrl" $ | quote }}
            - name: OIDC_CLIENT_ID
              value: storefront
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: storefront-client-secret
            {{- end }}
          # Up to two minutes to start (the JVM services are the slow ones) before liveness takes over.
          startupProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: {{ $svc.readyPath | default $svc.healthPath }}
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml ($svc.resources | default $.Values.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- range $i, $p := $svc.writablePaths }}
            - name: writable-{{ $i }}
              mountPath: {{ $p }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- range $i, $p := $svc.writablePaths }}
        - name: writable-{{ $i }}
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sprocketry.labels" $ | nindent 4 }}
spec:
  {{- $nodePort := and (eq $.Values.cloud "local") $svc.public $.Values.local.publicNodePort }}
  {{- if $nodePort }}
  type: NodePort
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if $nodePort }}
      nodePort: {{ $nodePort }}
      {{- end }}
{{- end }}
{{- end }}
