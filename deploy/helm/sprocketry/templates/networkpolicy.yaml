{{- if .Values.networkPolicy.enabled }}
{{- $apps := keys .Values.services | sortAlpha }}
# Deny all ingress to every pod in the namespace; the policies below open only what is needed.
# Kubelet health probes come from the node, which Cilium allows regardless of policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "sprocketry.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Service invocation goes sidecar to sidecar on Dapr's internal gRPC port; the sidecar then
# calls its app over localhost, which policies don't see.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dapr-invocation
  labels:
    {{- include "sprocketry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [{{ join ", " $apps }}] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [{{ join ", " $apps }}] }
      ports:
        - { port: 50002, protocol: TCP }
{{- range $name, $svc := .Values.services }}
{{- if $svc.public }}
---
# Public entry point: reachable on its app port from the gateway (and anything else, as it is public anyway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-{{ $name }}
  labels:
    {{- include "sprocketry.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: {{ $svc.port }}, protocol: TCP }
{{- end }}
{{- end }}
{{- if eq .Values.cloud "local" }}
{{- range $store, $port := dict "postgres" 5432 "valkey" 6379 }}
---
# In-cluster {{ $store }} accepts connections from the app pods (and their Dapr sidecars) only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-{{ $store }}
  labels:
    {{- include "sprocketry.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $store }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [{{ join ", " $apps }}] }
      ports:
        - { port: {{ $port }}, protocol: TCP }
{{- end }}
{{- end }}
{{- end }}
