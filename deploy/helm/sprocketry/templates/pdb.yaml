{{- /* A single-replica service gets no PDB: it could only block drains, not protect availability. */ -}}
{{- $apps := splitList "," (include "sprocketry.apps" .) }}
{{- range $name, $svc := .Values.services }}
{{- if and (has $name $apps) (gt (int $svc.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "sprocketry.labels" $ | nindent 4 }}
spec:
  maxUnavailable: {{ $.Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- end }}
