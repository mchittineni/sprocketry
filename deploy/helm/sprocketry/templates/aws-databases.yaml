{{- if and (eq .Values.cloud "aws") .Values.aws.databases }}
# Creates the databases RDS doesn't: it makes only catalog (infra/aws). Connects as the same user, to the
# postgres maintenance database every RDS server has, and skips any database that already exists, so it
# is safe to run again. Until External Secrets has written the Secret it waits, and the services that
# need these databases restart until they exist.
apiVersion: batch/v1
kind: Job
metadata:
  name: create-databases
  labels:
    {{- include "sprocketry.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: create-databases
        {{- include "sprocketry.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The postgres user of the alpine image.
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: {{ .Values.local.postgres.image }}
          env:
            - name: CATALOG_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: catalog-database-url
            - { name: HOME, value: /tmp }
          command:
            - sh
            - -ec
            - |
              # postgres://user:pass@host:5432/catalog?sslmode=require -> the same server's postgres database.
              url="${CATALOG_URL%/catalog*}/postgres?sslmode=require"
              for db in {{ join " " .Values.aws.databases }}; do
                echo "SELECT 'CREATE DATABASE $db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$db')\gexec"
              done | psql "$url" -v ON_ERROR_STOP=1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
