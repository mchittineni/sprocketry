{{- if ne .Values.cloud "local" }}
{{- if eq .Values.cloud "azure" }}
# Reads Azure Key Vault using the External Secrets controller's own workload identity.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cloud-secrets
  labels:
    {{- include "sprocketry.labels" . | nindent 4 }}
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      tenantId: {{ required "azure.tenantId is required" .Values.azure.tenantId | quote }}
      vaultUrl: {{ required "azure.keyVaultUrl is required" .Values.azure.keyVaultUrl | quote }}
{{- else if eq .Values.cloud "aws" }}
# Reads AWS Secrets Manager. With no auth block the controller uses its own credentials: the IAM role
# EKS Pod Identity gives its service account (infra/aws).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cloud-secrets
  labels:
    {{- include "sprocketry.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "aws.region is required" .Values.aws.region | quote }}
{{- else if eq .Values.cloud "gcp" }}
# Reads Google Secret Manager. With no auth block the controller uses its own credentials: the IAM
# Workload Identity Federation grants its service account (infra/gcp).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cloud-secrets
  labels:
    {{- include "sprocketry.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ required "gcp.projectId is required" .Values.gcp.projectId | quote }}
{{- else }}
{{- fail (printf "cloud must be azure, aws, gcp or local, not %s" .Values.cloud) }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  labels:
    {{- include "sprocketry.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secretRefreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-secrets
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ . }}
    {{- end }}
{{- end }}
