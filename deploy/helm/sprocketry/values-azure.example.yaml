# Copy to values-azure.yaml and fill from `terraform output` in infra/azure/envs/dev.
cloud: azure

image:
  registry: acrsprocketrydevxxxxx.azurecr.io
  tag: "0.1.0"

azure:
  tenantId: "00000000-0000-0000-0000-000000000000"
  keyVaultUrl: "https://kv-sprocketrydevxxxxx.vault.azure.net/"
  serviceBusNamespace: "sb-sprocketrydevxxxxx.servicebus.windows.net"
  appsClientId: "00000000-0000-0000-0000-000000000000"

gateway:
  enabled: true
  hostname: shop.example.com

# Sign-in through Keycloak at /auth on the storefront's hostname. Serve the gateway over HTTPS before
# shoppers use it: the realm refuses sign-in over plain HTTP from the internet (auth.sslRequired).
auth:
  enabled: true
  storefrontUrl: https://shop.example.com
  keycloakUrl: https://shop.example.com/auth
  keycloakPath: /auth

# Traces, metrics and logs into an in-cluster Grafana (make grafana).
observability:
  collector:
    enabled: true
  lgtm:
    enabled: true

# Canary releases (Argo Rollouts), judged on the in-cluster Prometheus, and runtime fault flags (flagd).
rollouts:
  enabled: true
flags:
  enabled: true
