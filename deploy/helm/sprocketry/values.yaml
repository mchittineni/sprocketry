# Registry the CI pipeline pushes to, e.g. acrsprocketrydevxxxxx.azurecr.io.
# image.tag is the fallback; services.<name>.tag (set by CI in values-image-tags.yaml) wins.
image:
  registry: ghcr.io/mchittineni/sprocketry
  tag: latest
  pullPolicy: IfNotPresent

# Cloud provider that backs the Dapr components and the secret store.
# "azure" uses the managed services below; "local" runs Postgres and Valkey in the cluster (see values-local.yaml).
cloud: azure

# Only used when cloud is "local".
local:
  postgres:
    image: postgres:18-alpine
    user: sprocketry
    password: sprocketry
  valkey:
    image: valkey/valkey:9.1-alpine
  # NodePort for public services, so kind can map it to the host. Empty uses ClusterIP.
  publicNodePort: 30080

azure:
  tenantId: ""
  keyVaultUrl: ""          # terraform output key_vault_uri
  serviceBusNamespace: ""  # terraform output servicebus_namespace
  appsClientId: ""         # terraform output workload_identity_client_ids["apps"]

# Kubernetes Secret that External Secrets fills from Key Vault.
secretName: sprocketry-secrets
secretRefreshInterval: 1h
secrets:
  - catalog-database-url
  - shipping-database-url
  - redis-host
  - redis-password
  # Read only when auth.enabled.
  - reviews-database-url
  - profile-database-url
  - keycloak-db-url
  - keycloak-db-username
  - keycloak-db-password
  - keycloak-admin-password
  - storefront-client-secret

observability:
  # OTLP gRPC endpoint for Dapr sidecar traces. Empty sends them to the collector below when it is
  # enabled, and otherwise disables tracing.
  otlpEndpoint: ""
  samplingRate: "1"
  # Recorded on every signal as deployment.environment.name.
  environment: dev
  # OpenTelemetry Collector agent on every node: Dapr traces and metrics, and container logs.
  collector:
    enabled: false
    image: otel/opentelemetry-collector-contrib:0.162.0
    # OTLP gRPC endpoint to forward to. Empty uses the in-cluster LGTM below.
    exportEndpoint: ""
    exportInsecure: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi
  # Grafana, Loki, Tempo and Prometheus in one pod. Suits a dev cluster; data does not survive restarts.
  lgtm:
    enabled: false
    image: grafana/otel-lgtm:0.36.0
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi

# Shopper sign-in through Keycloak (OpenID Connect). Turns on the reviews and profile services, and
# Sign in, Account and reviews on the storefront.
auth:
  enabled: false
  # Addresses as a browser sees them, without a trailing slash. Access tokens name Keycloak's address
  # as their issuer, and the services accept no other.
  storefrontUrl: ""   # e.g. http://localhost:8080
  keycloakUrl: ""     # e.g. http://localhost:8081, or https://shop.example.com/auth behind the gateway
  # Path Keycloak serves under. Use /auth when it shares the storefront's hostname behind the gateway.
  keycloakPath: /
  # Audience the services require in access tokens; the storefront's Keycloak client adds it.
  audience: sprocketry-api
  # Keycloak refuses sign-in over plain HTTP from public addresses ("external"); "none" allows it.
  # Keep "external" and serve the gateway over HTTPS for anything reachable from the internet.
  sslRequired: external
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # Only for cloud: local. NodePort that kind maps to http://localhost:8081.
    nodePort: ""
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

# Default-deny ingress for the namespace. App pods then accept only Dapr sidecar traffic
# (service invocation), plus public services on their app port. Egress is not restricted.
networkPolicy:
  enabled: true

# Services with more than one replica get a PDB, so node drains (AKS auto-upgrades) evict one pod at a time.
podDisruptionBudget:
  maxUnavailable: 1

gateway:
  enabled: false
  name: public
  namespace: gateway-system
  hostname: ""

services:
  storefront:
    port: 3000
    replicas: 2
    healthPath: /api/healthz
    public: true
    # Next.js writes its cache here; the root filesystem is read-only.
    writablePaths: [/app/.next/cache]
    # Signs shoppers in through Keycloak when auth.enabled.
    oidcClient: true
  catalog:
    port: 8080
    replicas: 2
    healthPath: /healthz
    # Liveness uses healthPath; readiness uses readyPath when set. /readyz also checks the database.
    readyPath: /readyz
    secretEnv:
      DATABASE_URL: catalog-database-url
  cart:
    port: 8080
    replicas: 2
    healthPath: /healthz
  shipping:
    port: 8080
    replicas: 2
    healthPath: /healthz
    secretEnv:
      DATABASE_URL: shipping-database-url
  payment:
    port: 8080
    replicas: 2
    healthPath: /healthz
    workloadIdentity: true
    env:
      PAYMENT_FAILURE_RATE: "0"
      PAYMENT_DELAY_MS: "0"
  fulfillment:
    port: 8080
    replicas: 1
    healthPath: /healthz
    workloadIdentity: true
    env:
      DISPATCH_MAX_DELAY_MS: "500"
  # The services below need auth.enabled: they check shoppers' Keycloak access tokens (oidc).
  reviews:
    port: 8080
    replicas: 2
    healthPath: /healthz
    readyPath: /readyz
    requiresAuth: true
    oidc: true
    secretEnv:
      DATABASE_URL: reviews-database-url
  profile:
    port: 8080
    replicas: 2
    healthPath: /healthz
    readyPath: /readyz
    requiresAuth: true
    oidc: true
    secretEnv:
      DATABASE_URL: profile-database-url
    # The JVM needs more headroom than the default.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
