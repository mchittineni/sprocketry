# Single-node kind cluster. The storefront NodePort (values.yaml local.publicNodePort)
# is published on the host as http://localhost:8080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
