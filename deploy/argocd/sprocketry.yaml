apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sprocketry
  namespace: argocd
spec:
  project: default
  source:
    # scripts/bootstrap-cluster.sh replaces this with your clone's origin when it applies the file.
    repoURL: https://github.com/mchittineni/sprocketry.git
    targetRevision: main
    path: deploy/helm/sprocketry
    helm:
      valueFiles:
        - values-azure.yaml
        # CI commits each service's new image tag here, which is what makes Argo CD roll it out.
        - values-image-tags.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sprocketry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
