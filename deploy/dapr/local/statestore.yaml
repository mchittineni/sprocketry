# Local stand-in for Azure Managed Redis.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: valkey:6379
# cart keeps carts here, storefront keeps sign-in sessions.
scopes: [cart, storefront]
